# local_costmap_params.yaml
local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 0.5
  static_map: false
  rolling_window: true
  width: 3.0
  height: 3.0
  resolution: 0.05
  
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
    
  obstacle_layer:
    enabled: true
    max_obstacle_height: 2.0
    obstacle_range: 2.5
    raytrace_range: 3.0
    inflation_radius: 0.2
    track_unknown_space: false
    combination_method: 1

    observation_sources: laser_scan_sensor table_point_cloud
    laser_scan_sensor: {sensor_frame: laser_link, data_type: LaserScan, topic: /scan, marking: true, clearing: true}
    table_point_cloud: {sensor_frame: map, data_type: PointCloud2, topic: /obstacle_point_cloud, marking: true, clearing: true}
    
  inflation_layer:
    enabled: true
    cost_scaling_factor: 5.0
    inflation_radius: 0.3